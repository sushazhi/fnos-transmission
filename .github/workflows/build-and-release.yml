name: Build and Release Transmission for fnOS

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop, test ]
  workflow_dispatch:
    inputs:
      transmission_version:
        description: 'Transmission version (e.g., 4.1.3)'
        required: false
        default: ''
      arch:
        description: 'Target architecture (arm64 / amd64 / both)'
        required: false
        default: 'both'

permissions:
  contents: write

jobs:
  build:
    name: Build Transmission - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          APP_VERSION=$(grep "^version = " manifest | cut -d' ' -f3)
          # Extract transmission version (first 3 parts), e.g., 4.1.3.2.32 -> 4.1.3
          TRANSMISSION_VERSION=$(echo "$APP_VERSION" | cut -d'.' -f1-3)
          # Check if version is 3-part (e.g., 4.1.3) for release
          VERSION_PARTS=$(echo "$APP_VERSION" | tr '.' '\n' | wc -l)
          if [ "$VERSION_PARTS" -eq 3 ]; then
            IS_RELEASE_VERSION="true"
          else
            IS_RELEASE_VERSION="false"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "TRANSMISSION_VERSION=${TRANSMISSION_VERSION}" >> $GITHUB_OUTPUT
          echo "TRANSMISSION_VERSION=${TRANSMISSION_VERSION}" >> $GITHUB_ENV
          echo "IS_RELEASE_VERSION=${IS_RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "IS_RELEASE_VERSION=${IS_RELEASE_VERSION}" >> $GITHUB_ENV
          echo "Read version from manifest: ${APP_VERSION}"
          echo "Transmission version: ${TRANSMISSION_VERSION}"
          echo "Is release version (3-part): ${IS_RELEASE_VERSION}"

      - name: Prepare app structure
        run: |
          # 与 build.py [2/6] 对应：复制项目文件到构建根目录
          # 注意：app/ui/config 与 app/ui/images 已在仓库中，无需复制
          mkdir -p app/bin app/lib
          cp -r cmd config wizard . 2>/dev/null || true
          cp manifest ICON.PNG ICON_256.PNG . 2>/dev/null || true
          echo "Project files copied"

      - name: Download transmission-daemon and libminiupnpc
        run: |
          TRANSMISSION_VERSION="${{ env.TRANSMISSION_VERSION }}"
          ARCH="${{ matrix.arch }}"
          BASE="https://github.com/sushazhi/fnos-transmission/releases/download/v${TRANSMISSION_VERSION}"

          # 依次尝试带架构名 -> 不带架构名
          for name in "transmission-daemon-${TRANSMISSION_VERSION}-${ARCH}" "transmission-daemon-${TRANSMISSION_VERSION}" "transmission-daemon"; do
            echo "Trying ${name}..."
            if wget -q "${BASE}/${name}" -O app/bin/transmission-daemon 2>/dev/null && [ -s app/bin/transmission-daemon ]; then
              echo "Downloaded ${name}"
              break
            fi
          done
          if [ ! -s app/bin/transmission-daemon ]; then
            echo "ERROR: Failed to download transmission-daemon for ${ARCH} (release v${TRANSMISSION_VERSION})"
            exit 1
          fi
          chmod +x app/bin/transmission-daemon

          # libminiupnpc（可选）
          for name in "libminiupnpc.so.17-${TRANSMISSION_VERSION}-${ARCH}" "libminiupnpc.so.17-${TRANSMISSION_VERSION}" "libminiupnpc.so.17"; do
            echo "Trying ${name}..."
            if wget -q "${BASE}/${name}" -O app/lib/libminiupnpc.so.17 2>/dev/null && [ -s app/lib/libminiupnpc.so.17 ]; then
              echo "Downloaded ${name}"
              break
            fi
          done
          if [ ! -s app/lib/libminiupnpc.so.17 ]; then
            echo "WARNING: libminiupnpc.so.17 not available for ${ARCH} in release v${TRANSMISSION_VERSION}"
          fi

      - name: Download trpanel (WebUI manager)
        run: |
          ARCH="${{ matrix.arch }}"
          # 解析 trpanel 最新 release
          TAG=$(curl -s https://api.github.com/repos/sushazhi/trpanel/releases/latest | sed -n 's/.*"tag_name": "v\([^"]*\)".*/\1/p')
          if [ -z "$TAG" ]; then
            echo "ERROR: Failed to resolve trpanel latest release"
            exit 1
          fi
          ASSET="trpanel-v${TAG}-linux-${ARCH}.tar.gz"
          echo "Downloading ${ASSET}..."
          wget -q "https://github.com/sushazhi/trpanel/releases/download/v${TAG}/${ASSET}" -O /tmp/trpanel.tar.gz
          if [ ! -s /tmp/trpanel.tar.gz ]; then
            echo "ERROR: Failed to download ${ASSET}"
            exit 1
          fi
          mkdir -p /tmp/trpanel-extract
          tar -xzf /tmp/trpanel.tar.gz -C /tmp/trpanel-extract
          # 定位 trpanel 可执行文件并重命名为 transmission-manager
          TRPANEL_BIN=$(find /tmp/trpanel-extract -type f -name "trpanel" | head -1)
          if [ -z "$TRPANEL_BIN" ] || [ ! -s "$TRPANEL_BIN" ]; then
            echo "ERROR: trpanel binary not found in ${ASSET}"
            exit 1
          fi
          cp "$TRPANEL_BIN" app/bin/transmission-manager
          chmod +x app/bin/transmission-manager
          echo "trpanel v${TAG} extracted to transmission-manager"

      - name: Verify binaries
        run: |
          echo "Binary verification:"
          file app/bin/transmission-daemon
          file app/bin/transmission-manager
          ls -lh app/bin/
          ls -la app/lib/ 2>/dev/null || echo "(no libs)"
          if [ ! -s app/bin/transmission-daemon ]; then
            echo "ERROR: transmission-daemon not found"
            exit 1
          fi
          if [ ! -s app/bin/transmission-manager ]; then
            echo "ERROR: transmission-manager not found"
            exit 1
          fi

      - name: Download fnpack
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            FNPACK_BINARY="fnpack-1.2.3-linux-amd64"
          else
            FNPACK_BINARY="fnpack-1.2.3-linux-arm"
          fi
          wget -q "https://static2.fnnas.com/fnpack/${FNPACK_BINARY}" -O fnpack
          chmod +x fnpack

      - name: Build .fpk package
        run: |
          ./fnpack build .
          PACKAGE_NAME="transmission-${APP_VERSION}-${{ matrix.arch }}.fpk"
          mv transmission.fpk "${PACKAGE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

      - name: Create SHA256 checksums
        run: |
          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256sum"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transmission-${{ matrix.arch }}-fpk
          path: |
            ${{ env.PACKAGE_NAME }}
            ${{ env.PACKAGE_NAME }}.sha256sum
          retention-days: 30

      - name: Build summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Build Summary - Transmission for fnOS

          **Version:** ${{ env.APP_VERSION }}
          **Transmission Version:** ${{ env.TRANSMISSION_VERSION }}
          **Architecture:** ${{ matrix.arch }}
          **Is Release Version:** ${{ env.IS_RELEASE_VERSION }}

          **Components:**
          - Transmission daemon: ${{ matrix.arch }} binary (from release v${{ env.TRANSMISSION_VERSION }})
          - WebUI: trpanel (Go+React 单二进制) ${{ matrix.arch }}

          **Build Artifacts:**
          - Package: \`${PACKAGE_NAME}\`
          - Checksum: \`${PACKAGE_NAME}.sha256sum\`
          EOF

      - name: Publish Release with Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Read changelog from manifest
          CHANGELOG_RAW=$(grep "changelog" manifest | sed 's/.*changelog\s*=\s*//')
          CHANGELOG="$CHANGELOG_RAW"

          echo "Publishing release..."
          RELEASE_TAG="${{ github.ref_name }}"
          ARCH="${{ matrix.arch }}"
          PACKAGE="transmission-${APP_VERSION}-${ARCH}.fpk"

          # Create the release if it doesn't exist yet (race-safe for parallel matrix jobs)
          if gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$CHANGELOG" 2>/dev/null; then
            echo "Release $RELEASE_TAG created"
          else
            echo "Release $RELEASE_TAG already exists (or was created by another job), uploading $ARCH assets..."
          fi

          # Upload package (with clobber in case another job raced us)
          gh release upload "$RELEASE_TAG" "${PACKAGE}" --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}