name: musl-static-daemon

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Transmission 上游 tag（不带 v）'
        required: true
        default: '4.1.3'
  push:
    branches: [ci/musl-daemon]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || '4.1.3' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, arch: arm64 }
          - { runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Write build script
        run: |
          cat > build.sh <<'EOF'
          #!/bin/sh
          set -eux
          OUT=/w/out
          mkdir -p "$OUT"
          apk add --no-cache build-base cmake ninja pkgconfig linux-headers tar xz gzip curl git file \
            curl-dev curl-static libevent-dev libevent-static openssl-dev zlib-dev c-ares-dev \
            openssl-libs-static zlib-static nghttp2-static brotli-static zstd-static \
            libpsl-static libidn2-static libunistring-static
          # c-ares 的静态库随 c-ares-dev 提供（Alpine 没有 c-ares-static 包）
          # 让 pkg-config 始终输出 --static 链接行（含 Libs.private 里的静态依赖）
          cat > /usr/local/bin/pkgconf-static <<'XEOF'
          #!/bin/sh
          exec /usr/bin/pkgconf --static "$@"
          XEOF
          chmod +x /usr/local/bin/pkgconf-static
          export PKG_CONFIG=/usr/local/bin/pkgconf-static
          cd /tmp
          curl -fsSLo src.tar.xz "https://github.com/transmission/transmission/releases/download/${VERSION}/transmission-${VERSION}.tar.xz"
          tar xf src.tar.xz
          cd "transmission-${VERSION}"
          # 下载/解包完成后才隐藏动态库 dev 链接 libX.so（find_library 命中的名字），
          # 此时容器内 curl/git 等工具已不再需要；cmake 4.x 上 -DCMAKE_FIND_LIBRARY_SUFFIXES
          # 不可靠（实测仍选中 .so），移走后 find_library 只能命中 /usr/lib/libX.a
          mkdir -p /noso
          for lib in curl event_core event_extra event_openssl event_pthreads event \
                     ssl crypto z cares nghttp2 idn2 unistring psl brotlidec brotlicommon zstd; do
            mv /usr/lib/lib${lib}.so /noso/ 2>/dev/null || true
          done
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
            -DEVENT2_PREFER_STATIC_LIB=ON \
            -DCURL_USE_STATIC_LIBS=ON \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_DAEMON=ON -DENABLE_GTK=OFF -DENABLE_QT=OFF -DENABLE_MAC=OFF \
            -DENABLE_CLI=OFF -DENABLE_UTILS=OFF -DENABLE_NLS=OFF \
            -DINSTALL_DOC=OFF -DINSTALL_EXAMPLES=OFF \
            -DUSE_SYSTEM_EVENT2=ON -DUSE_SYSTEM_CURL=ON -DUSE_SYSTEM_OPENSSL=ON \
            -DUSE_SYSTEM_DHT=OFF -DUSE_SYSTEM_MINIUPNPC=OFF \
            -DUSE_SYSTEM_NATPMP=OFF -DUSE_SYSTEM_UTP=OFF -DUSE_SYSTEM_B64=OFF -DUSE_SYSTEM_PSL=OFF
          cmake --build build -j "$(nproc)"
          cp build/daemon/transmission-daemon "$OUT/transmission-daemon"
          file "$OUT/transmission-daemon" || true
          ldd "$OUT/transmission-daemon" 2>&1 || true
          EOF

      - name: Build in Alpine (native arch)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w" -e VERSION alpine:latest sh /w/build.sh 2>&1 | tee build-docker.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 80000 build-docker.log > build-log.txt || true
          for i in 1 2 3; do
            gh release upload "v${VERSION}" "build-log.txt#musl-build-log-${{ matrix.arch }}" \
              --clobber --repo "$GITHUB_REPOSITORY" && break
            echo "retry $i"; sleep 15
          done

      - name: Inspect binary
        run: |
          file out/transmission-daemon
          ls -la out/
          sha256sum out/transmission-daemon | tee out/sha256.txt

      - name: Rename per arch
        run: mv out/transmission-daemon "out/transmission-daemon-musl-${{ matrix.arch }}"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: transmission-daemon-musl-${{ matrix.arch }}
          path: out/*

      - name: Upload to release v4.1.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            gh release upload "v${VERSION}" "out/transmission-daemon-musl-${{ matrix.arch }}" \
              --clobber --repo "$GITHUB_REPOSITORY" && break
            echo "retry $i"; sleep 15
          done
          gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
